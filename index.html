        .form-card { background-color: #ffffff; border-radius: 1rem; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); border: 1px solid #e2e8f0; padding: 1.5rem; margin-bottom: 1.5rem; }

        select option { color: #0f172a; background-color: #ffffff; }
        
        .modal-overlay { position: fixed; inset: 0; background-color: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background-color: #ffffff; width: 100%; max-width: 42rem; border-radius: 1rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); overflow: hidden; transform: scale(0.95); transition: transform 0.3s ease; display: flex; flex-direction: column; max-height: 90vh; }

        .toast { position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%); background-color: #0f172a; color: #ffffff; padding: 0.75rem 1.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); opacity: 0; transition: opacity 0.3s ease; z-index: 200; pointer-events: none; }

    <script>
        // Struktur Bed Ruang Interna (Total 32 Bed)
        const bedRooms = [
            { id: 'bed_1a', name: 'Ruang 1.A', max: 2 },
            { id: 'bed_1b', name: 'Ruang 1.B', max: 2 },
            { id: 'bed_1c', name: 'Ruang 1.C', max: 2 },
            { id: 'bed_1d', name: 'Ruang 1.D', max: 1 },
            { id: 'bed_1e', name: 'Ruang 1.E', max: 2 },
            { id: 'bed_1f', name: 'Ruang 1.F', max: 1 },
            { id: 'bed_2a', name: 'Ruang 2.A', max: 3 },
            { id: 'bed_2b', name: 'Ruang 2.B', max: 3 },
            { id: 'bed_3a', name: 'Ruang 3.A', max: 4 },
            { id: 'bed_3b', name: 'Ruang 3.B', max: 4 },
            { id: 'bed_3c', name: 'Ruang 3.C', max: 4 },
            { id: 'bed_hcu1', name: 'Ruang HCU 1', max: 1 },
            { id: 'bed_hcu2', name: 'Ruang HCU 2', max: 1 },
            { id: 'bed_isolasi', name: 'Ruang Isolasi', max: 2 }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            // Set Default Tanggal Hari Ini
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('tanggal').value = `${year}-${month}-${day}`;

            // Inisialisasi perhitungan bed awal
            hitungBed();
        });

        // Kalkulasi Kapasitas Bed Ruang Interna
        function hitungBed() {
            let totalTerisi = 0;
            let totalReady = 0;
            let readyList = [];
            let rusakList = [];

            bedRooms.forEach(room => {
                const el = document.getElementById(room.id);
                const val = el ? el.value : '0';

                if (val === 'rusak') {
                    rusakList.push(room.name);
                } else {
                    const terisi = parseInt(val) || 0;
                    totalTerisi += terisi;
                    const sisaReady = room.max - terisi;
                    totalReady += sisaReady;

                    if (sisaReady > 0) {
                        readyList.push(`${room.name}: ${sisaReady} Bed`);
                    }
                }
            });

            document.getElementById('bed_terisi').value = `${totalTerisi} Bed`;
            document.getElementById('bed_ready').value = `${totalReady} Bed Ready`;
            
            let details = '';
            if (readyList.length > 0) {
                details += readyList.map(item => `  • ${item}`).join('\n');
            } else {
                details += "  • Tidak ada bed ready";
            }

            if (rusakList.length > 0) {
                details += `\n\n*Ruangan Rusak / Belum Bisa Digunakan:*\n` + rusakList.map(r => `  • ${r}`).join('\n');
            }

            window.readyRoomsDetails = details;
        }

        function formatTanggalIndo(dateStr) {
            if (!dateStr) return '-';
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            
            const parts = dateStr.split('-');
            const year = parseInt(parts[0]);
            const month = parseInt(parts[1]) - 1;
            const day = parseInt(parts[2]);
            
            const d = new Date(year, month, day);
            return `${days[d.getDay()]}, ${day} ${months[month]} ${year}`;
        }

        const val = (id) => {
            const el = document.getElementById(id);
            return el ? el.value.trim() : '';
        };

        function generateLaporanText() {
            // Jalankan ulang kalkulasi agar window.readyRoomsDetails terbarui
            hitungBed();

            const tglFormatted = formatTanggalIndo(val('tanggal'));
            
            let totalTerisi = 0;
            let totalReady = 0;
            bedRooms.forEach(room => {
                const el = document.getElementById(room.id);
                const v = el ? el.value : '0';
                if (v !== 'rusak') {
                    const terisi = parseInt(v) || 0;
                    totalTerisi += terisi;
                    totalReady += (room.max - terisi);
                }
            });

            return `🏥 *LAPORAN HARIAN RAWAT INAP*
*RSUD KOL. ABUNDJANI BANGKO*

🗓️ *Hari/Tanggal:* ${tglFormatted}
⏰ *Shift:* ${val('shift') || '-'}
📍 *Ruangan:* ${val('ruangan') || 'Ruang Interna'}

📊 *STATUS KAPASITAS BED (TOTAL 32 BED)*
• Bed Terisi : ${totalTerisi} Bed
• Bed Ready  : ${totalReady} Bed

*Rincian Bed Ready Per Kamar:*
${window.readyRoomsDetails || '  • Tidak ada'}

👥 *SDM KEPERAWATAN*
• Hadir Dinas : ${val('hadir') || '0'} Orang
• Tidak Hadir : ${val('tidak_hadir') || '0'} Orang

⚠️ *KENDALA PELAYANAN RUANGAN*
${val('kendala') || 'Nihil'}

✍️ *DILAPORKAN OLEH:*
*${val('pelapor') || '-'}*`;
        }

        function togglePreview(show) {
            const modal = document.getElementById('previewModal');
            if (show) {
                document.getElementById('modalOutput').innerText = generateLaporanText();
                modal.classList.add('active');
            } else {
                modal.classList.remove('active');
            }
        }

        function triggerResetConfirm() {
            document.getElementById('resetConfirmModal').classList.add('active');
        }

        function closeResetConfirm() {
            document.getElementById('resetConfirmModal').classList.remove('active');
        }

        function resetForm() {
            location.reload();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg || "BERHASIL DISALIN!";
            toast.classList.add('active');
            setTimeout(() => { toast.classList.remove('active'); }, 2200);
        }

        function fallbackCopy(text) {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                showToast("BERHASIL DISALIN!");
            } catch (err) {
                showToast("GAGAL MENYALIN TEKS");
            }
            document.body.removeChild(textarea);
        }

        function copyData() {
            const text = generateLaporanText();
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast("BERHASIL DISALIN!");
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }
    </script>
</body>
</html>
